# Pixtart en local: docker compose up --build   →  web en http://localhost:5173, API en http://localhost:8000
services:
  db:
    image: postgres:17
    environment: {POSTGRES_USER: pixtart, POSTGRES_PASSWORD: pixtart, POSTGRES_DB: pixtart}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U pixtart"], interval: 5s, retries: 10}
  valkey:
    image: valkey/valkey:8
  api:
    build: ./backend
    env_file: .env
    depends_on: {db: {condition: service_healthy}, valkey: {condition: service_started}}
    command: sh -c "alembic upgrade head 2>/dev/null || python -m app.core.crear_tablas; uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes: [pdfs:/data/pdfs]
  worker:
    build: ./backend
    env_file: .env
    depends_on: [api]
    volumes: [pdfs:/data/pdfs]
    command: celery -A app.core.celery_app:celery worker --loglevel=info
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  pgdata:
  pdfs:
