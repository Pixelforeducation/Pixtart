[project]
name = "pixtart"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.3",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "python-multipart>=0.0.12",
  "celery[redis]>=5.4.0",
  "boto3>=1.35.36",
  "cryptography>=43.0.1",
  "argon2-cffi>=23.1.0",
  "pyjwt>=2.9.0",
  "anthropic>=0.39.0",
  "pypdf>=5.0.1",
  "pytesseract>=0.3.13",
  "pdf2image>=1.17.0",
  "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3", "ruff==0.6.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
